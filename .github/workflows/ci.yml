name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest -q

  # Teste com dados reais: mapeia e converte um mês da fonte, sem publicar nada.
  sonda:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Página da Base de Dados (amostra do HTML)
        run: |
          curl -sSL -A "dou.md/0.1" "https://www.in.gov.br/acesso-a-informacao/dados-abertos/base-de-dados?ano=2026&mes=Agosto" -o pagina.html || true
          wc -c pagina.html
          grep -oiE 'href="[^"]*\.zip[^"]*"' pagina.html | head -20 || true
      - name: Mapear agosto/2026
        run: python -m dou_md mapear --de 2026-08 --ate 2026-08 && cat estado/inventario.csv
      - name: Migrar Seção 1 de agosto/2026 (sem publicar)
        run: |
          python -m dou_md migrar --mes 2026-08 --janela 999
          echo "Arquivos .md: $(find dados -name '*.md' | wc -l)"; du -sh dados
          find dados -name '*.md' | head -3 | xargs -I{} sh -c 'echo "=== {}"; head -c 2500 "{}"; echo'
          cat PROGRESS.md
